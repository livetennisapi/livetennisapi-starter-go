name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/truthcheck.sh   # product facts stay current
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'   # the documented floor
      - run: go test ./...     # no network
